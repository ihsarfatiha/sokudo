services:
  - type: web
    name: sokudo-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm ci --include=dev && npm run prisma:generate --workspace=apps/api && npm run build --workspace=apps/api
    startCommand: npm run prisma:deploy --workspace=apps/api && npm run start:prod --workspace=apps/api
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.20.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
